name: Build animated profile banner
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/banner.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate native animated SVG banners
        run: |
          cat > /tmp/banner.py <<'PY'
          from PIL import Image,ImageEnhance
          import numpy as np
          im=Image.open("portrait-dither.png").convert("L")
          im=ImageEnhance.Contrast(im).enhance(1.3).resize((120,142))
          a=np.asarray(im); strength=(255-a)/255
          def paths(c):
            bins=[[] for _ in range(4)]
            for j in range(142):
              for i in range(120):
                s=strength[j,i]
                if s<.10: continue
                k=min(3,int(s*4)); x=58+i*2.82; y=112+j*2.78; z=[.55,.75,1,1.25][k]
                bins[k].append(f"M{x:.1f},{y:.1f}h{z}v{z}h-{z}z")
            return "".join(f'<path d="{"".join(b)}" fill="{c}" opacity="{[.24,.42,.66,.95][k]}"/>' for k,b in enumerate(bins) if b)
          def make(dark):
            bg,panel,purple,cyan,main,muted=("#0A101F","#070B16","#A78BFA","#22D3EE","#E5E7EB","#64748B") if dark else ("#F8FAFC","#FFFFFF","#7C3AED","#0891B2","#111827","#475569")
            dots=paths(purple)
            travelers="".join(f'<circle cx="{60+(n*37)%340}" cy="{120+(n*61)%390}" r=".7"><animate attributeName="cx" values="{60+(n*37)%340};{70+(n*53)%340};{60+(n*37)%340}" dur="{6+(n%9)*.7:.1f}s" begin="{(n%32)*.1:.1f}s" repeatCount="indefinite"/></circle>' for n in range(180))
            return f'''<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"><defs><clipPath id="p"><rect x="46" y="104" width="378" height="418" rx="7"/></clipPath></defs>
          <rect width="1180" height="610" fill="{bg}"/><rect x="14" y="14" width="1152" height="582" rx="12" fill="none" stroke="{cyan}" opacity=".35"/>
          <g font-family="monospace"><text x="38" y="49" fill="{cyan}" font-size="19">profile.sh --live</text><circle cx="1015" cy="42" r="6" fill="#10B981"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="1034" y="49" fill="{cyan}" font-size="15">@P2025edro</text><text x="45" y="91" fill="{purple}" font-size="16">VISUAL.MAP</text></g>
          <rect x="45" y="103" width="380" height="420" rx="8" fill="{panel}" stroke="{purple}"/><g clip-path="url(#p)"><g>{dots}<animate attributeName="opacity" values="0;.15;.5;1;1" keyTimes="0;.08;.16;.23;1" dur="14.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 2;1 -1;-1 1;0 2" dur="14.2s" repeatCount="indefinite"/></g><g fill="{cyan}" opacity=".45">{travelers}</g></g>
          <text x="55" y="550" fill="{purple}" font-family="monospace" font-size="12">&gt; HUMAN.EXE // BUILDING A BETTER TOMORROW</text><line x1="462" y1="78" x2="462" y2="535" stroke="{cyan}" opacity=".25"/>
          <g font-family="monospace"><text x="500" y="95" fill="{cyan}" font-size="17">SYSTEM.INFO</text><text x="500" y="137" fill="{muted}" font-size="12">SUBJECT</text><text x="680" y="137" fill="{main}" font-size="15">Pedro Silva</text><text x="500" y="174" fill="{muted}" font-size="12">ROLE</text><text x="680" y="174" fill="{main}" font-size="15">Founder · Software Developer</text><text x="500" y="211" fill="{muted}" font-size="12">ORIGIN</text><text x="680" y="211" fill="{main}" font-size="15">Dublin, Ireland</text><text x="500" y="248" fill="{muted}" font-size="12">EDUCATION</text><text x="680" y="248" fill="{main}" font-size="15">BSc Computing</text><text x="500" y="285" fill="{muted}" font-size="12">STATUS</text><text x="680" y="285" fill="#10B981" font-size="14">BUILDING · LEARNING · SHIPPING</text><text x="500" y="339" fill="{cyan}" font-size="17">CORE.STACK</text><text x="500" y="380" fill="{muted}" font-size="12">CORE.LANG</text><text x="680" y="380" fill="{main}" font-size="14">JavaScript · TypeScript</text><text x="500" y="417" fill="{muted}" font-size="12">CORE.FRONTEND</text><text x="680" y="417" fill="{main}" font-size="14">React · Vite</text><text x="500" y="454" fill="{muted}" font-size="12">CORE.BACKEND</text><text x="680" y="454" fill="{main}" font-size="14">Node.js</text><text x="500" y="491" fill="{muted}" font-size="12">CORE.DATABASE</text><text x="680" y="491" fill="{main}" font-size="14">SQLite</text><text x="500" y="528" fill="{muted}" font-size="12">CORE.INFRA</text><text x="680" y="528" fill="{main}" font-size="14">GitHub · Vercel</text></g></svg>'''
          open("dark.svg","w").write(make(True)); open("light.svg","w").write(make(False))
          PY
          python /tmp/banner.py
      - name: Commit banners
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dark.svg light.svg
          git diff --cached --quiet || git commit -m "Build animated VISUAL.MAP banner"
          git push
